server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API gateway. The browser calls /backend/... and nginx
    # forwards to the api Service in the same namespace or Compose network. The
    # trailing slash on proxy_pass strips the /backend prefix, so FastAPI still
    # sees its own root paths unchanged. One UI image therefore serves every
    # environment, and a cross-origin request never leaves the browser.
    #
    # `^~` is load bearing. Without it the asset regex location below would be
    # tested against API paths and could shadow a request that ends in a
    # matched extension.
    location ^~ /backend/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Run progress is a Server-Sent Events stream held open for minutes.
        # Buffering would hold tokens in nginx until the stream closed, so the
        # live console would only update at the end of a run.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Assistant origin. The browser streams SSE from the Mastra host, so
    # buffering must stay off or tokens arrive only when the turn ends. The read
    # timeout matches the host server timeout so a long tool call is not cut at
    # the proxy. proxy_pass's trailing slash strips /mastra, so the host sees
    # its own /api/... routes unchanged.
    #
    # `^~` is required for the same reason the /backend/ block carries it:
    # without it the asset regex location below is tested first and can shadow
    # the request.
    location ^~ /mastra/ {
        proxy_pass http://mastra:4111/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Next.js static export inlines the hydration payload in <script> tags, so
    # script-src needs 'unsafe-inline' (a static build cannot use nonces).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: http://localhost:8000 http://localhost:4111; img-src 'self' data:; style-src 'self'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
