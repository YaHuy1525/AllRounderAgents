apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - servicemonitor-api.yaml

configMapGenerator:
  - name: allrounder-dashboards
    files:
      - dashboards/chat-stream.json
    options:
      labels:
        # The Grafana sidecar watches for exactly this label.
        grafana_dashboard: "1"

generatorOptions:
  # Stable name (no content hash): `kubectl get cm -n monitoring` then always
  # shows exactly where the dashboard lives.
  disableNameSuffixHash: true
