apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  # Look for Services in the app namespace...
  namespaceSelector:
    matchNames:
      - allrounder
  # ...whose labels match the api Service from §4.2.
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
