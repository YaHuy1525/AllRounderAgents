apiVersion: apps/v1
kind: Deployment
metadata:
  name: mastra
  labels:
    app.kubernetes.io/name: mastra
    app.kubernetes.io/part-of: allrounder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mastra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mastra
        app.kubernetes.io/part-of: allrounder
    spec:
      containers:
        - name: mastra
          image: ghcr.io/yahuy1525/allrounderagent-mastra:sha-placeholder
          ports:
            - name: http
              containerPort: 4111
          envFrom:
            - configMapRef:
                name: allrounder-config
            - secretRef:
                name: allrounder-secrets
          env:
            # Belt and braces: make the bind explicit even if .env disagrees.
            - name: PORT
              value: "4111"
            - name: MASTRA_HOST
              value: 0.0.0.0
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mastra
  labels:
    app.kubernetes.io/name: mastra
    app.kubernetes.io/part-of: allrounder
spec:
  selector:
    app.kubernetes.io/name: mastra
  ports:
    - name: http
      port: 4111
      targetPort: http
