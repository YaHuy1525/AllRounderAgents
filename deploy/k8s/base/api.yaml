apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: allrounder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: allrounder
    spec:
      containers:
        - name: api
          image: ghcr.io/yahuy1525/allrounderagent-api:sha-placeholder
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: allrounder-config
            - secretRef:
                name: allrounder-secrets
          env:
            # In-cluster addresses win over the ConfigMap values (env > envFrom).
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: MASTRA_BASE_URL
              value: http://mastra:4111
            - name: CORS_ALLOW_ORIGINS
              value: '["http://app.127.0.0.1.nip.io"]'
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: allrounder
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
