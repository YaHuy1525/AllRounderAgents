apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything this particular cluster needs: namespace, real hostnames,
# pinned image tags.
namespace: allrounder

resources:
- ../../base

patches:
- path: ingress-patch.yaml
  target:
    kind: Ingress
    name: allrounder

images:
- name: ghcr.io/yahuy1525/allrounderagent-api
  newName: ghcr.io/yahuy1525/allrounderagent-api
  newTag: sha-b6f4bc7
- name: ghcr.io/yahuy1525/allrounderagent-mastra
  newName: ghcr.io/yahuy1525/allrounderagent-mastra
  newTag: sha-b6f4bc7
- name: ghcr.io/yahuy1525/allrounderagent-ui
  newName: ghcr.io/yahuy1525/allrounderagent-ui
  newTag: sha-b6f4bc7
