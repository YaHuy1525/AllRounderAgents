[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "allrounder-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
  "prometheus-client>=0.21,<1",
  "PyJWT[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  "redis>=5.2,<6",
  # Audit pack PDF rendering (allrounder_api.audit_pack).
  "reportlab>=4.2,<6",
  "structlog>=25.1,<26",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
  # Judge-based eval harness only (scripts/judge-eval.py). The API runtime
  # never imports it: judging.py loads the SDK lazily inside JevJudge.
  "typesafe-sdk>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/allrounder_api"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]

[tool.coverage.run]
branch = true
source = ["allrounder_api"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
# qoder-plugins holds vendored third-party plugin packages (scripts copied
# verbatim from their upstream sources). They are not part of the API package
# and are kept byte-faithful, so they stay outside the lint surface.
extend-exclude = ["qoder-plugins"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["allrounder_api"]
explicit_package_bases = true
mypy_path = ["apps/api/src"]

[[tool.mypy.overrides]]
module = ["typesafe_sdk", "typesafe_sdk.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true
