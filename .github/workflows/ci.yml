name: CI

on:
  push:
  pull_request:
    # A docs-only pull request changes no executable surface, so it must not
    # burn a full polyglot CI run.
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# Newest run per ref wins. Cancellation is limited to pull requests so a push
# to main always finishes and can be deployed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test with coverage
        run: python -m pytest --cov --cov-report=term-missing
      - name: Golden ticket gate
        run: python scripts/golden-eval.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Supabase-compatible roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists extensions;
          do $$
          begin
            create role anon nologin;
          exception when duplicate_object then null;
          end
          $$;
          do $$
          begin
            create role authenticated nologin;
          exception when duplicate_object then null;
          end
          $$;
          SQL
      - name: Apply migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

  migration-lint:
    # Migrations on a live database cannot be unwound by a revert, so a
    # destructive statement is blocked at review time rather than at deploy
    # time. A migration that genuinely needs it opts in explicitly with an
    # `-- ALLOW-DESTRUCTIVE: <reason>` line inside the file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check migrations for destructive changes
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash deploy/scripts/check-migrations.sh "$CI_BASE"

  security:
    # Dependency vulnerability sweep. The Python audit is advisory on first
    # adoption so a pre-existing finding cannot freeze every deploy. Flip
    # continue-on-error to false once the backlog is triaged. The npm audit is
    # blocking at high severity because the shipped images install these trees.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --quiet -e ".[dev]" pip-audit
      - name: Audit Python dependencies
        continue-on-error: true
        run: python -m pip_audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install production JavaScript dependencies
        run: npm ci --workspaces=false --omit=dev --legacy-peer-deps
      - name: Audit JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high

  judge:
    # Re-judges the committed candidates and fails on regression against the
    # committed baselines. Without JEV_API_KEY the CLI skips cleanly (exit 0),
    # so forks and Dependabot PRs stay green.
    runs-on: ubuntu-latest
    env:
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'jev-latest' }}
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Cache judge results
        uses: actions/cache@v4
        with:
          path: evals/judge/.cache
          key: judge-${{ vars.JUDGE_MODEL || 'jev-latest' }}-${{ hashFiles('evals/judge/rubrics/*.json', 'evals/judge/prompts/*.txt') }}
      - name: Judge gate
        run: python scripts/judge-eval.py gate --suite all --summary
