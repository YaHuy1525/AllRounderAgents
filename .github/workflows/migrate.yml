name: Migrate

# Database migrations are deliberately NOT automatic. Reverting a pin commit
# rolls images back, but it does not un-drop a column, so applying schema
# changes stays a human decision made with the dry run in front of them.
# CI already proves every migration applies to a clean pgvector database, and
# migration-lint blocks destructive statements, so this job only needs to run
# the delta against the real project.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: >-
          Type APPLY to confirm these migrations run against the live database.
        required: true
        type: string
      include_all:
        description: >-
          Recovery only. Also push migrations missing from the remote history
          table, which normally means the remote has diverged.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run without an explicit confirmation phrase
        run: |
          if [ "${{ inputs.confirmation }}" != "APPLY" ]; then
            echo "Expected confirmation 'APPLY', got '${{ inputs.confirmation }}'. Aborting." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show the pending migrations first
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          npx supabase db push --dry-run

      # --yes is mandatory here. Without it the CLI waits for an interactive
      # confirmation that a CI runner can never answer, and the job hangs until
      # the workflow timeout instead of failing fast.
      - name: Apply the pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.include_all }}" = "true" ]; then
            npx supabase db push --include-all --yes
          else
            npx supabase db push --yes
          fi

      # After this job succeeds, run deploy/scripts/verify-deployment.ps1 on the
      # cluster host. A migration that shipped ahead of code expecting it is the
      # one failure mode no in-pipeline check can see from a laptop k3d cluster.
