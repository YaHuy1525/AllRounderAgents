name: allrounder-agent

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mastra:
    image: allrounder-mastra:local
    build:
      context: .
      dockerfile: Dockerfile.mastra
    env_file:
      - .env
    environment:
      # Belt and braces, mirroring deploy/k8s/base/mastra.yaml: bind explicitly
      # even if .env carries a conflicting PORT or MASTRA_HOST value.
      PORT: "4111"
      MASTRA_HOST: "0.0.0.0"
      # Compose-network address of the bundled API: the MSP draft step grounds
      # through POST /knowledge/search and the bills lane checks senders via
      # POST /msp/vendors/lookup, both authenticated by KNOWLEDGE_SERVICE_TOKEN
      # from .env. Without the pair, drafts carry no retrieval and every bill
      # escalates as vendor_unverified.
      KNOWLEDGE_API_URL: "http://api:8000"
    ports:
      - "4111:4111"
    healthcheck:
      # TCP probe (same shape as the k8s manifest): the bundle exposes no
      # dedicated health route, and the port opens only once routes load.
      test: ["CMD", "node", "-e", "const net=require('net');net.connect(4111,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  api:
    image: allrounder-api:local
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Compose-network address of the bundled Mastra host; overrides the
      # host-bridge value in .env so no host process is required.
      MASTRA_BASE_URL: "http://mastra:4111"
      CORS_ALLOW_ORIGINS: '${DOCKER_CORS_ALLOW_ORIGINS:-["http://localhost:3000"]}'
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      mastra:
        condition: service_healthy
    restart: unless-stopped

  ui:
    image: allrounder-ui:local
    build:
      context: .
      dockerfile: apps/approval-ui/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${VITE_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
