# Tool permission matrix, v1 (Master Plan Phase 5 — Governance hardening).
#
# Every tool an agent surface may call declares its scope, approval class and
# idempotency discipline. apps/api/tests/test_governance.py walks this file and
# asserts:
#   * every write on a transport appears here (no undeclared tools),
#   * every side-effecting workflow step maps to `run.side-effect`,
#   * every connectable provider (N2 `connectors:` below) carries a reviewed
#     scope + class and is renderable in the console vocabulary,
#   * every `approval` tool in the matrix has a denial path exercised in the
#     suite (receipt verification, never the caller's claim).
#
# Classes:
#   auto       — deterministic, idempotent, no human receipt needed
#   approval   — acts only with a signed receipt bound to scope + action hash
#   refuse     — never auto-runs (policy refuses; human task is created)
#   read-only  — cannot mutate anything; no idempotency needed
version: 1

tools:
  - name: jira.comment
    description: Post a routing/spawn receipt comment on a Jira issue.
    scope: jira-projects
    class: auto
    idempotent: true
    idempotency_key: eventId

  - name: jira.transition
    description: Move a Jira issue through its workflow.
    scope: jira-projects
    class: auto
    idempotent: true
    idempotency_key: eventId

  - name: jira.create-ticket
    description: File the cross-domain spawn ticket (support -> bug) with evidence.
    scope: jira-projects
    class: auto
    idempotent: true
    idempotency_key: correlationId

  # The desk seam (src/mastra/desks/types.ts): the provider-neutral ticket
  # surface the MSP flow calls. Method names mirror the adapter interface 1:1
  # (createTicket, addComment, setStatus, attachEvidence, readTicket). Writes
  # carry the flow's stable tokens so a replay lands on the recorded receipt
  # instead of a second ticket, comment or transition.
  - name: desk.create-ticket
    description: Create the client ticket behind the desk seam.
    scope: desk-tickets
    class: auto
    idempotent: true
    idempotency_key: correlationId

  - name: desk.comment
    description: Post the reply receipt comment on the desk ticket.
    scope: desk-tickets
    class: auto
    idempotent: true
    idempotency_key: receiptRef

  - name: desk.transition
    description: Move the desk ticket through its workflow.
    scope: desk-tickets
    class: auto
    idempotent: true
    idempotency_key: eventId

  - name: desk.attach
    description: Attach audit evidence to the desk ticket.
    scope: desk-tickets
    class: auto
    idempotent: true
    idempotency_key: evidenceRef

  - name: desk.read
    description: Read desk tickets, comments and status.
    scope: desk-tickets
    class: read-only

  - name: support.send
    description: Send an approved support reply.
    scope: support:send
    class: approval
    idempotent: true
    idempotency_key: draftHash

  - name: finance.post
    description: Post the approved journal to the sandbox ledger.
    scope: finance:post
    class: approval
    idempotent: true
    idempotency_key: ledgerKey

  # The bills lane's ledger seam (src/mastra/agents/bills/tools): reading a
  # bill back is read-only, and posting is approval-only behind the signed
  # receipt for `bills:post`. The ledger refuses an empty receipt, and Xero
  # receives ACCPAY bills in DRAFT status only, so the blast radius of any
  # single approval stays one deletable draft.
  - name: xero.read
    description: Read a bill's current state from the Xero ledger.
    scope: xero-ledger
    class: read-only

  - name: xero.post
    description: Post the approved vendor bill to Xero as a draft ACCPAY bill.
    scope: xero:post
    class: approval
    idempotent: true
    idempotency_key: ledgerKey

  - name: run.side-effect
    description: >-
      Any workflow side effect (template scope `{workflow}:{step}`, e.g.
      security:contain). Acts only with the signed receipt for that scope.
    scope: "{workflow}:{step}"
    class: approval
    idempotent: true
    idempotency_key: actionHash

  # MSP audit pack (M2): a derived view over the immutable trail only (archive
  # union registry, case ledger, receipts), never live workflow state. The
  # packKey is `{tenant}:{clientRef}:{month}`, so re-exporting a month is a
  # no-op for the same trail.
  - name: auditpack.export
    description: Export one client's monthly audit pack, JSON or PDF, from the trail.
    scope: audit-packs
    class: auto
    idempotent: true
    idempotency_key: packKey

  # Read-only defaults: none of these can mutate Jira, GitHub or the knowledge
  # store — they are the only tools research steps hold.
  - name: jira.read
    description: Search issues, list boards, read board issues.
    scope: jira-projects
    class: read-only

  - name: github.read
    description: List allowlisted repositories, PRs and file contents for review.
    scope: repo-allowlist
    class: read-only

  - name: knowledge.retrieve
    description: Hybrid retrieval over the knowledge store (citations returned).
    scope: knowledge-domains
    class: read-only

  # Coding-lane web search (Path B tool loop): a read-only function tool the
  # investigator/actor/critic may call for current external context (library
  # docs, API references, known issues). It cannot mutate anything, so it
  # carries no idempotency, exactly like the other read-only research tools.
  - name: web.search
    description: Read-only web search for current external context (library docs, API references, known issues).
    scope: web-search
    class: read-only

  # Coding-lane repository reads (agent quality upgrade, Phase 1): read-only
  # function tools that let the investigator and actor see allowlisted repo
  # state for themselves instead of relying only on flow-stuffed context. The
  # GITHUB_REPOSITORY_ALLOWLIST is re-checked inside every call and fails
  # closed when unset; with no GitHub credentials the tools degrade to an
  # availability error string. Write-side GitHub actions stay flow-owned
  # behind run.side-effect receipts — agents hold no mutation tools.
  - name: repo.read_file
    description: Read one file (or a line window) from an allowlisted repository at a pinned ref.
    scope: repo-allowlist
    class: read-only

  - name: repo.list_dir
    description: List the directory entries of an allowlisted repository.
    scope: repo-allowlist
    class: read-only

  - name: repo.search_code
    description: Search an allowlisted repository for code matches (paths and previews only).
    scope: repo-allowlist
    class: read-only

  # Actor self-verification loop (Phase 2): the same deterministic structure
  # floor (json/yaml/xml/basic-syntax) the flow scores with, exposed in-turn
  # so the actor fixes failures before returning. Pure function, no network,
  # no mutation; the flow's validators remain the authoritative pass.
  - name: patch.validate
    description: Validate a draft patch against the deterministic structure validators.
    scope: coding-lane-local
    class: read-only

  # Console assistant reads (option C of the assistant rail): the three Mastra
  # tools the console chat agent holds. `resolve_start_fields` reads the start
  # contract each workflow already publishes plus the values the records can
  # prove; `lookup_employee` reads one person's org facts; `list_tickets`
  # reads the tenant's lane-matched tickets through the same board search the
  # console list uses. All three reach the serving plane over the shared
  # service bridge (KNOWLEDGE_API_URL plus KNOWLEDGE_SERVICE_TOKEN), and none
  # writes: starting a run is the operator's confirm button on the card,
  # which posts /runs with a user credential. The assistant therefore holds no
  # writer to declare.
  - name: console.resolve_start_fields
    description: Read a workflow's start fields and the values the records can prove.
    scope: workflow-start-fields
    class: read-only

  - name: console.lookup_employee
    description: Read one employee's org facts (id, name, role, department, manager, status).
    scope: employee-directory
    class: read-only

  - name: console.list_tickets
    description: Read the tenant's board tickets filtered by workflow lane keywords, capped.
    scope: jira-projects
    class: read-only

  # QA squad writes (the qa lane): two, both behind a human decision. Writing
  # the case set is the approve-cases gate; filing a defect is the
  # approve-defects gate, and the file-defects step refuses any finding the
  # approver did not keep. The case store keys on caseSetHash, so re-saving a
  # reviewed set is a no-op; filing keys on `{storyKey}:{caseId}`, so a second
  # failing run comments on the existing defect instead of filing a twin.
  - name: qa.cases-write
    description: Write the approved case set to the lane's case store.
    scope: qa-cases
    class: approval
    idempotent: true
    idempotency_key: caseSetHash

  - name: qa.file-defect
    description: File or comment one approved QA finding on Jira as a Bug.
    scope: qa-defects
    class: approval
    idempotent: true
    idempotency_key: correlationId

# Connectable providers (N2 connector registry). Each entry is a console
# connection home (Settings -> Connections): the provider id is the display
# vocabulary shared with apps/approval-ui (lib/integrations.ts), the scope is
# the reviewed permission scope the connection is registered under (slack is
# catalog-only: the connection never carries a workflow action), and the class
# is the strongest approval posture of any action that flows through it.
# Connecting a provider never grants a tool — execution permissions stay in
# the matrix above, and the durable seed mirror lives in
# supabase/migrations/202610100015_connectors.sql (pinned by test_connectors).
connectors:
  - provider: github
    description: Repository reads and pull-request actions for the coding lanes.
    scope: repo-allowlist
    class: read-only

  - provider: jira
    description: Comment, transition and spawn tickets behind the desk seam.
    scope: jira-projects
    class: auto

  - provider: gmail
    description: Sends the HR help desk reply behind the hr-help:send receipt.
    scope: hr-help:send
    class: approval

  - provider: calendar
    description: Schedules interview slots behind the screening:schedule receipt.
    scope: screening:schedule
    class: approval

  - provider: slack
    description: Approver notifications only — never a workflow action.
    scope: approver-notify
    class: approval
